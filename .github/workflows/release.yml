# Builds, signs and releases TrueDuty for every common desktop:
#   Windows x64 and ARM64   .msi installer + Setup .exe installer + portable .zip
#   macOS Apple silicon and Intel   .dmg + .pkg installer + portable .zip
#   Linux x64 and ARM64     .deb + .rpm installers, .AppImage, portable .tar.gz
# Triggers: push to main/master -> v2.0.<run>, tag v1.2.3 -> v1.2.3, or Run workflow by hand.
#
# Antivirus and trust (details in docs/code-signing.md):
#   - Builds are Nuitka standalone folders, never one-file self extractors (the main false positive trigger).
#   - Every file gets a Sigstore build provenance attestation and a SHA-256 checksum.
#   - Windows Authenticode, in this order, whichever secrets exist:
#       SignPath (free for open source):   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID  + variables SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
#       Azure Trusted Signing:             AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET + variables AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_PROFILE
#       Any .pfx certificate:              WIN_CERT_PFX_BASE64, WIN_CERT_PASSWORD
#   - macOS: MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_IDENTITY, MAC_INSTALLER_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   - Linux: GPG_PRIVATE_KEY, GPG_PASSPHRASE (detached .asc)
#   - VIRUSTOTAL_API_KEY: every file is scanned and the report links go into the release notes.
name: release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs: { v: '${{ steps.v.outputs.v }}' }
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="2.0.${{ github.run_number }}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   plat: windows, arch: x64 }
          - { os: windows-11-arm,   plat: windows, arch: arm64 }
          - { os: macos-15,         plat: macos,   arch: arm64 }
          - { os: macos-15-intel,   plat: macos,   arch: x64 }
          - { os: ubuntu-22.04,     plat: linux,   arch: x64 }
          - { os: ubuntu-22.04-arm, plat: linux,   arch: arm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.plat }}-${{ matrix.arch }}
    env:
      TD_VERSION: ${{ needs.version.outputs.v }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_PFX: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: app/requirements.txt }
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk patchelf ccache libxss1 rpm file
      - name: Python packages
        run: python -m pip install -r app/requirements.txt imageio zstandard ordered-set
      - name: Stamp version
        shell: bash
        run: sed -i.bak "s/^APP = 'TrueDuty'; VERSION = '[^']*'/APP = 'TrueDuty'; VERSION = '${TD_VERSION}'/" app/main.py && rm -f app/main.py.bak
      - name: Build
        working-directory: app
        run: python build.py
        timeout-minutes: 120

      # ---------------- Windows: sign the program files, package, sign the installer ----------------
      - name: SignPath upload (program files)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: sp1
        uses: actions/upload-artifact@v4
        with: { name: 'unsigned-files-${{ matrix.arch }}', path: app/dist/TrueDuty }
      - name: SignPath sign (program files)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: files
          github-artifact-id: ${{ steps.sp1.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: app/dist/TrueDuty
      - name: Azure Trusted Signing (program files)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH != 'true' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: app/dist/TrueDuty
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: PFX signing (program files)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH != 'true' && env.HAS_AZURE != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env: { WIN_CERT_PFX_BASE64: '${{ secrets.WIN_CERT_PFX_BASE64 }}', WIN_CERT_PASSWORD: '${{ secrets.WIN_CERT_PASSWORD }}' }
        run: ./app/packaging/sign-pfx.ps1 app/dist/TrueDuty
      - name: .NET for the WiX MSI builder (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/packaging/windows.ps1 $env:TD_VERSION ${{ matrix.arch }} out
      - name: SignPath upload (installer)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        id: sp2
        uses: actions/upload-artifact@v4
        with:
          name: 'unsigned-setup-${{ matrix.arch }}'
          path: |
            out/TrueDuty-Setup-*.exe
            out/*.msi
      - name: SignPath sign (installer)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.sp2.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out
      - name: Azure Trusted Signing (installer)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH != 'true' && env.HAS_AZURE == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: out
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: PFX signing (installer)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH != 'true' && env.HAS_AZURE != 'true' && env.HAS_PFX == 'true'
        shell: pwsh
        env: { WIN_CERT_PFX_BASE64: '${{ secrets.WIN_CERT_PFX_BASE64 }}', WIN_CERT_PASSWORD: '${{ secrets.WIN_CERT_PASSWORD }}' }
        run: Get-ChildItem out -Include 'TrueDuty-Setup-*.exe', '*.msi' -Recurse | ForEach-Object { ./app/packaging/sign-pfx.ps1 $_.FullName }
      - name: Signature report (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem out, app/dist/TrueDuty -Recurse -Include *.exe, *.msi | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "{0,-60} {1} {2}" -f $_.Name, $s.Status, $s.SignerCertificate.Subject }

      # ---------------- macOS ----------------
      - name: Import Apple certificates
        if: runner.os == 'macOS' && env.MAC_CERT_P12_BASE64 != ''
        env: { MAC_CERT_P12_BASE64: '${{ secrets.MAC_CERT_P12_BASE64 }}', MAC_CERT_PASSWORD: '${{ secrets.MAC_CERT_PASSWORD }}' }
        run: |
          kc=$RUNNER_TEMP/build.keychain; security create-keychain -p ci "$kc"; security set-keychain-settings "$kc"; security unlock-keychain -p ci "$kc"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"; security list-keychains -d user -s "$kc" login.keychain; rm $RUNNER_TEMP/cert.p12
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_IDENTITY: ${{ secrets.MAC_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./app/packaging/macos.sh "$TD_VERSION" ${{ matrix.arch }} out

      # ---------------- Linux ----------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./app/packaging/linux.sh "$TD_VERSION" ${{ matrix.arch }} out

      # ---------------- every system ----------------
      - name: GPG signatures
        if: env.HAS_GPG == 'true'
        shell: bash
        env: { GPG_PRIVATE_KEY: '${{ secrets.GPG_PRIVATE_KEY }}', GPG_PASSPHRASE: '${{ secrets.GPG_PASSPHRASE }}' }
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in out/*; do gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"; done
      - name: Checksums
        shell: bash
        run: cd out && for f in *; do case "$f" in *.asc|*.sha256) ;; *) (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") > "$f.sha256";; esac; done; ls -la
      - name: Build provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with: { subject-path: 'out/*' }
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.plat }}-${{ matrix.arch }}', path: out/* }

  publish:
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}   # publish what was built even if one system failed
    runs-on: ubuntu-latest
    env:
      HAS_VT: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true, pattern: '{windows,macos,linux}-*' }
      - name: VirusTotal scan
        if: env.HAS_VT == 'true'
        env: { VT: '${{ secrets.VIRUSTOTAL_API_KEY }}' }
        run: |
          : > vt.md
          for f in out/*; do case "$f" in *.sha256|*.asc) continue;; esac
            sz=$(stat -c %s "$f"); url=https://www.virustotal.com/api/v3/files
            if [ "$sz" -gt 32000000 ]; then url=$(curl -s -H "x-apikey: $VT" https://www.virustotal.com/api/v3/files/upload_url | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"])'); fi
            curl -s -H "x-apikey: $VT" -F "file=@$f" "$url" > /dev/null || true
            h=$(sha256sum "$f" | cut -d' ' -f1); echo "- [$(basename "$f")](https://www.virustotal.com/gui/file/$h)" >> vt.md
            sleep 16   # free API: 4 requests a minute
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.v }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          ls out/* >/dev/null 2>&1 || { echo "nothing was built"; exit 1; }
          (cd out && cat *.sha256 > SHA256SUMS.txt)
          {
            printf '%s\n\nCommit %s\n\n' "$COMMIT_MSG" "${GITHUB_SHA::7}"
            echo '| System | Installer | Portable |'
            echo '|---|---|---|'
            echo '| Windows x64 / ARM64 | `TrueDuty-*-windows-<arch>.msi` (or `TrueDuty-Setup-*.exe`) | `*-windows-<arch>-portable.zip` |'
            echo '| macOS Apple silicon / Intel | `.dmg` or `.pkg` | `*-macos-<arch>-portable.zip` |'
            echo '| Linux x64 / ARM64 | `.deb`, `.rpm` or `.AppImage` | `*-linux-<arch>-portable.tar.gz` |'
            printf '\nVerify: `sha256sum -c SHA256SUMS.txt --ignore-missing` or `gh attestation verify <file> --repo %s`.\n' "$GITHUB_REPOSITORY"
            [ -s vt.md ] && { printf '\n**VirusTotal**\n'; cat vt.md; }
          } > notes.md 2>/dev/null || true
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "v$V" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TrueDuty $V" --notes-file notes.md
